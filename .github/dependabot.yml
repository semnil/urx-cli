version: 2
# Every entry runs every day at 00:00 JST on a cron schedule; `interval: daily`
# runs on weekdays only.
#
# Which of these pull requests merge on their own, and why: the header of
# .github/workflows/dependabot-auto-merge.yml.
#
# vendor/urx-device has no entry on purpose: a new common commit is adopted in
# its own pull request with this repository's checks, never by a scheduled bump.
updates:
  # Dev dependencies (Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node 26 runtime in .node-version; a major jump
      # moves with the runtime by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The workspace crates' dependencies (Dependabot reads Cargo.lock). The napi
  # crates are pinned with `=`, so each bump is a pull request of its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates of napi, napi-derive and napi-build arrive in
      # one pull request: the code napi-derive generates calls into napi, and
      # the addon's build and tests in CI check the versions together. A major
      # update of any of them is a pull request of its own.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
        update-types: ["minor", "patch"]

  # Actions are SHA-pinned with a version comment (`@<sha> # vX.Y.Z`);
  # Dependabot bumps the pin and comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
