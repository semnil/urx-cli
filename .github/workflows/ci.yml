name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    # The CLI is distributed for these two OSes (K16), so its checks, and the
    # addon its tests load, run and build on both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
          cache: pnpm
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
        timeout-minutes: 5
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm build-inputs:check
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 10
      - run: pnpm build:native
        timeout-minutes: 10
      - run: pnpm test

  # The one context the main ruleset requires (.github/required-checks.json).
  # `if: always()` keeps it from being skipped when a job it needs fails: a
  # skipped required check reports success.
  ci-required:
    needs: [typescript]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        if: needs.typescript.result != 'success'
        env:
          TYPESCRIPT: ${{ needs.typescript.result }}
        run: |
          echo "::error::CI did not pass — typescript=${TYPESCRIPT}"
          exit 1
