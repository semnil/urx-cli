name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    # The CLI is distributed for these two OSes (K16), so its checks, and the
    # addon its tests load, run and build on both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
          cache: pnpm
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
        timeout-minutes: 5
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm build-inputs:check
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 10
      - run: cargo test --workspace --locked
        timeout-minutes: 10
      - run: pnpm build:native
        timeout-minutes: 10
      - run: pnpm test
      # The release build exports the commit under test and builds it again there.
      - run: pnpm build:release
        timeout-minutes: 15
      # The release output works on its own, away from the checkout.
      - run: node scripts/check-release-output.mjs dist-release
      # The official Node archive build-inputs.json records for this platform;
      # build:bundle refuses it unless its SHA-256 is the recorded one.
      - name: Download the Node archive
        shell: bash
        timeout-minutes: 5
        run: |
          url=$(node scripts/build-bundle.mjs --archive-url)
          archive="$RUNNER_TEMP/node-archive/${url##*/}"
          mkdir -p "$RUNNER_TEMP/node-archive"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
          echo "URX_NODE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - run: pnpm build:bundle --node-archive "$URX_NODE_ARCHIVE"
        shell: bash
      # The installed bundle matches its manifest and runs on its own.
      - run: node scripts/check-bundle.mjs dist-bundle
      # The Windows installer is compiled with the Inno Setup build-inputs.json
      # records, installed into a new folder from an installer refused unless
      # its SHA-256 is the recorded one.
      - name: Download and install Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 5
        run: |
          url=$(node scripts/inno-setup.mjs --url)
          installer="$RUNNER_TEMP/inno-setup-download/${url##*/}"
          mkdir -p "$RUNNER_TEMP/inno-setup-download"
          curl --fail --silent --show-error --location --retry 3 --output "$installer" "$url"
          iscc=$(node scripts/inno-setup.mjs --install "$installer" "$RUNNER_TEMP/inno-setup")
          echo "URX_ISCC=$iscc" >> "$GITHUB_ENV"
      - run: node scripts/build-windows-installer.mjs --iscc "$URX_ISCC"
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
      # The runner is a throwaway machine, so the check installs, reinstalls
      # and removes urx-cli for the runner's user.
      - run: node scripts/check-windows-installer.mjs
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          URX_DISPOSABLE_MACHINE: "1"
      # The macOS installer tree: urx-install, built with the bundle's release
      # manifest digest, beside a copy of the bundle.
      - run: node scripts/build-macos-installer.mjs
        if: runner.os == 'macOS'
        timeout-minutes: 15
      # The runner is a throwaway machine with sudo needing no password, so the
      # check installs, repairs and removes urx-cli system-wide.
      - run: node scripts/check-macos-installer.mjs
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          URX_DISPOSABLE_MACHINE: "1"

  # The one context the main ruleset requires (.github/required-checks.json).
  # `if: always()` keeps it from being skipped when a job it needs fails: a
  # skipped required check reports success.
  ci-required:
    needs: [typescript]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        if: needs.typescript.result != 'success'
        env:
          TYPESCRIPT: ${{ needs.typescript.result }}
        run: |
          echo "::error::CI did not pass — typescript=${TYPESCRIPT}"
          exit 1
