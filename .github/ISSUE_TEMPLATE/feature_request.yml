name: Feature request
description: A command or device function the urx command should provide
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Japanese are both fine — 日本語で構いません。
  - type: textarea
    id: summary
    attributes:
      label: What the command should do
      description: The device function, as the unit's screen or user guide names it, and how you would use it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Hardware evidence
      description: What you observed on the unit, if anything. Do not paste real device identifiers.
